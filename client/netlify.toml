# Netlify config, for if you prefer it to Vercel. Set the base directory to
# "client" in the Netlify UI, or deploy from the repo root with this file.

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every unmatched path serves index.html so React Router works
# on a hard refresh or a shared deep link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
